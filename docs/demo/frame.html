<!doctype html>
<!-- Window chrome around the everdir UI, used by capture.cjs. ?src=<everdir url>&pad=<px> -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: var(--pad); }
  .win { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden;
         border-radius: var(--radius); background: #15171c; box-shadow: var(--shadow); outline: 1px solid #3a3f4b; }
  .bar { flex: 0 0 34px; display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; background: #23262e;
         border-bottom: 1px solid #2a2e37; color: #c9ccd3; font: 600 13px system-ui, sans-serif; user-select: none; }
  .title { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .title img { width: 16px; height: 16px; }
  .btns { display: flex; gap: 14px; justify-content: flex-end; padding-right: 14px; }
  .btns svg { width: 12px; height: 12px; stroke: #9aa0ab; stroke-width: 1.6; fill: none; }
  iframe { flex: 1; border: 0; width: 100%; display: block; background: #15171c; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none; z-index: 5;
            transform: translate(-100px, -100px); filter: drop-shadow(0 1px 1.5px #0009); }
</style>
</head>
<body>
<div class="win">
  <div class="bar"><span></span>
    <span class="title"><img src="../../dist/everdir.svg" alt="">everdir</span>
    <span class="btns">
      <svg viewBox="0 0 12 12"><path d="M2 4.5l4 4 4-4"/></svg>
      <svg viewBox="0 0 12 12"><path d="M2 7.5l4-4 4 4"/></svg>
      <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
    </span>
  </div>
  <iframe id="app"></iframe>
</div>
<svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 17.5 L7 13.8 L9.8 20 L12.6 18.8 L9.9 12.6 L15.2 12.6 Z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
<script>
  const p = new URLSearchParams(location.search);
  const pad = +(p.get('pad') || 0);
  document.body.style.setProperty('--pad', pad + 'px');
  document.body.style.setProperty('--radius', pad ? '10px' : '0');
  document.body.style.setProperty('--shadow', pad ? '0 14px 40px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3)' : 'none');
  document.body.style.height = `calc(100vh - ${2 * pad}px)`;
  document.getElementById('app').src = p.get('src');
  window.cursorAt = (x, y) => { document.getElementById('cursor').style.transform = `translate(${x - 3}px, ${y - 2}px)`; };
</script>
</body>
</html>
