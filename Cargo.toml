[package]
name = "everdir"
version = "1.0.0"
edition = "2024"
# let-chains and slice::as_chunks need 1.88.
rust-version = "1.88"
description = "Whole-disk file index with instant search and a disk-usage treemap, served as a local web UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/boisenme/everdir"
keywords = ["search", "disk-usage", "treemap", "file-index", "macos"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
libc = "0.2"
memchr = "2"
rayon = "1"
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
